name: Blog CMS CD Pipeline for main branch

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
  
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: admin
                    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                    POSTGRES_DB: blogdb
                ports:
                    - 5432:5432
                options: >-
                  --health-cmd "pg_isready -U admin -d blogdb"
                  --health-interval 10s
                  --health-timeout 5s
                  --health-retries 5

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Python venv
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build Docker image
              run: docker build -t blog-cms:latest . 
              
            - name: Run and Test Docker container
              run: |
                  docker run -d \
                  --name blog-cms-test \
                  -p 8080:8080 \
                  --network host \
                  -e DB_HOST=localhost \
                  -e DB_PORT=5432 \
                  -e DB_NAME=blogdb \
                  -e DB_USER=admin \
                  -e DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
                  blog-cms:latest

                  for i in {1..30}; do
                  if curl --fail --silent http://localhost:8080/api/health; then
                  echo "Application is healthy"
                  exit 0
                  fi
                  echo "Waiting for application to be healthy..."
                  sleep 5
                  done
                  echo "Application is not healthy"
                  docker logs blog-cms-test
                  exit 1

            - name: Push Docker image to Docker Hub
              run: |
                docker tag blog-cms:latest ${{ secrets.DOCKERHUB_USERNAME }}/blog-cms:latest
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/blog-cms:latest

            - name: Run Deployment
              run: |
                docker run -d \
                  --name blog-cms-app \
                  -p 8080:8080 \
                  --network host \
                  -e DB_HOST=localhost \
                  -e DB_PORT=5432 \
                  -e DB_NAME=blogdb \
                  -e DB_USER=admin \
                  -e DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
                  ${{ secrets.DOCKERHUB_USERNAME }}/blog-cms:latest
